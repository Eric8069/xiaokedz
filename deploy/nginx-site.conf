# 小课桌 · 宝塔 nginx 可选优化配置
#
# 用法：宝塔面板 → 网站 → 设置 → 配置文件，
# 把下面内容追加到 server { ... } 内部，保存后重载 nginx。
# 不配置也能正常访问，这一段只是让首屏更快、缓存更合理。

# ---------- 1. gzip 压缩（全站约 300KB，压缩后约 90KB）----------
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# ---------- 2. 缓存策略 ----------
# HTML 不缓存，保证改完内容刷新即生效
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

# CSS / JS / 图标缓存 7 天（文件名没带 hash，所以不要设太长）
location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# ---------- 3. 安全响应头 ----------
add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "strict-origin-when-cross-origin";
add_header X-Frame-Options "SAMEORIGIN";

# ---------- 4. 默认首页 ----------
index index.html;

# ---------- 5. 单页应用兜底（hash 路由其实用不到，留着更稳）----------
# 直接访问 /math 这类不存在的路径时，交回 index.html，避免 404
location / {
    try_files $uri $uri/ /index.html;
}

# ---------- 6. 保护 api/ 下的敏感文件（开启云同步时必须加）----------
# ^~ 前缀匹配优先于正则 location，所以无论宝塔的 enable-php 配置写在哪都生效
location ^~ /api/config.php { return 404; }
location ^~ /api/config.example.php { return 404; }
location ^~ /api/install.sql { return 404; }

# ---------- 7. 用 git clone 部署时，挡住仓库里的开发目录（建议加）----------
# clone 会把 .git/、deploy/、dist/ 一起放进站点根目录，这些不该被外网读到。
# 用 deploy.sh / pack.sh 部署时它们本来就不上传，加着也无妨。
location ~ /\.(git|gitignore|htaccess|user\.ini|DS_Store|env) { return 404; }
location ^~ /deploy/ { return 404; }
location ^~ /dist/   { return 404; }
location ^~ /_test/  { return 404; }
location ~* \.(sql|log)$ { return 404; }
